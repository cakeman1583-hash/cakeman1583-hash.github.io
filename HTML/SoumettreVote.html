<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="fr" lang="fr">
	<head>
		<meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>OKOrNote</title>
		<link rel="icon" href="../Images/favicon.png" type="image/png" />
		<script type="text/javascript" src="../JS/main.js" defer></script>
		<link rel="stylesheet" type="text/css" href="../CSS/styles.css" />
	</head>
    <body>
        <div id="page">
            <header id="site-header">
                <img id="TitreHeader" src="../Images/OKOrNote.png" alt="Logo OKOrNote" />
                <p class="tagline">Notez et partagez vos avis</p>
                <nav id="main-nav">
                    <a href="Accueil.html">Accueil</a><a href="./SoumettreVote.html">Soumettre un vote</a><a href="./Credits.html">Crédits</a><a href="./Logo.html">Notre Logo</a>
                </nav>
            </header>

            <main id="content">
                <section id="capsules">
                    <div class="capsule" id="capsuleSoumettre">
                        <div class="textcapsule">
                            <h2 class="titrecapsule">Créer un vote</h2>
                            <p class="desccapsule">Proposez un nouveau sujet à la communauté. Remplissez le titre et décrivez brièvement le pour/contre.</p>

                            <!-- Notification de succès -->
                            <div id="notificationSucces" class="notification-success" style="display:none;">
                                <p><strong>✓ Vote soumis avec succès!</strong></p>
                                <p>Merci d'avoir proposé un nouveau sujet à la communauté.</p>
                            </div>

                            <form id="formSoumettre" action="#" method="post">
                                <label for="titre">Titre du vote</label>
                                <input type="text" id="titre" name="titre" required />

                                <label for="description">Description</label>
                                <textarea id="description" name="description" rows="6" required></textarea>

                                <div style="display:flex;gap:12px;margin-top:12px;">
                                    <input type="submit" value="Soumettre" />
                                    <input type="reset" value="Annuler" />
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </main>

            <footer id="site-footer">
                <a href="./Credits.html">&copy; OKOrNote</a>
            </footer>
        </div>

        <style>
        /* Harmonisation simple du formulaire avec le style du site */
        #formSoumettre label{ display:block; margin-top:10px; margin-bottom:6px; font-weight:bold; }
        #formSoumettre input[type="text"], #formSoumettre textarea{ width: 100%; box-sizing: border-box; padding:8px; border:1px solid #ccc; border-radius:8px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #formSoumettre input[type="submit"], #formSoumettre input[type="reset"]{ padding:8px 14px; border-radius:10px; border:1px solid black; cursor:pointer; }
        #formSoumettre input[type="submit"]{ background: #4CAF50; color:white; }
        #formSoumettre input[type="reset"]{ background: #f44336; color:white; }

        /* Notification de succès */
        .notification-success{ background: #d4edda; border: 2px solid #28a745; border-radius: 10px; padding: 15px; margin-bottom: 15px; text-align: center; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .notification-success p{ margin: 5px 0; color: #155724; }
        .notification-success strong{ font-size: 16px; }
        </style>

        <script>
        document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('formSoumettre');
            var notification = document.getElementById('notificationSucces');
            if (!form || !notification) return;

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                
                // Afficher la notification
                notification.style.display = 'block';
                
                // Masquer le formulaire après 1 seconde
                setTimeout(function () {
                    form.style.display = 'none';
                }, 1000);

                // Réinitialiser le formulaire (utile si l'utilisateur veut réafficher)
                form.reset();
            });
        });
        </script>
    </body>
</html>
